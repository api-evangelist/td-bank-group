  - url: https://stories.td.com/ca/en/news/2023-12-14-td-bank-group-and-plaid-enter-into-north-american-data-acces
    type: Documentation
    httpStatus: 200
    note: TD Stories announcement of the TD Bank Group + Plaid North American data-access agreement (Dec 2023) — the honest aggregator data-access posture.
  - url: https://www.td.com/ca/en/business-banking/small-business/payment-options/receiving/online-payment
    type: Documentation
    httpStatus: 200
    note: TD Canada Trust supports Interac e-Transfer for receiving online payments.
  - url: https://developer.td.com
    type: DeveloperPortal
    httpStatus: 000
    note: Did not resolve from this environment (DNS ENOTFOUND). This FDX/Akoya portal is the U.S. TD Bank, N.A. entity (profiled under api-evangelist/td-bank), NOT the Canadian parent.
  - url: https://www.payments.ca/systems-services/payment-systems/real-time-rail-payment-system/real-time-rail-developers
    type: Documentation
    note: Payments Canada Real-Time Rail developer portal/sandbox — shared national rail, operated by Payments Canada, not a TD first-party API.
actions:
  openapiHarvested: false
  reason: |
    No public OpenAPI/Swagger is published by the Canadian TD Bank Group entity.
    The only documented first-party specs (FDX/Akoya) belong to the separate U.S.
    subsidiary. Identity-only bootstrap with an honest aggregator-only data-access
    finding is the correct, non-fabricated result.
