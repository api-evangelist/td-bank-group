name: TD Bank Group
kind: company
description: >-
  TD Bank Group (The Toronto-Dominion Bank) is one of Canada's Big Six chartered
  banks — a federally regulated Schedule I bank headquartered in Toronto and
  listed on the TSX and NYSE under the ticker TD. It is among North America's
  largest banks by assets, serving roughly 27 million customers worldwide across
  Canadian Personal & Commercial Banking (TD Canada Trust), U.S. Retail (TD
  Bank, N.A. — America's Most Convenient Bank, a separately profiled entity), and
  Wholesale Banking (TD Securities). Like the rest of Canada's banking sector,
  TD's open-finance posture is voluntary: Canada's Consumer-Driven Banking
  framework was legislated in 2024 (Consumer-Driven Banking Act) but is not yet
  operational, so the Canadian parent exposes no first-party public developer
  API. Consumer financial-data access today is aggregator-based — TD signed a
  North American data-access agreement with Plaid in December 2023 — while
  payments run over the shared Canadian rails (Interac e-Transfer and Payments
  Canada's Real-Time Rail, with Interac as the RTR exchange solution provider).
  The FDX-aligned, Akoya-based open-banking API suite published at
  developer.td.com belongs to the U.S. subsidiary TD Bank, N.A., not this
  Canadian entity.
